<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<!-- Header -->
<header>
    <input type="checkbox" id="toggler">
    <label for="toggler" class="fas fa-bars"></label>
    <a href="#" class="logo">Nature's<span> Bouquet</span></a>
    <nav class="navbar">
        <a href="/flower">home</a>
        <a href="/products">products</a>
        <a href="#review">review</a>
        <a href="#contact">contact</a>
    </nav>
    <div class="icons">
        <a href="#" class="fas fa-heart"></a>
        <a href="/cart" class="fas fa-shopping-cart"></a>
        <a href="/details" class="fas fa-user"></a>
        <a href="/admin" class="fa-solid fa-user-tie"></a>
    </div>
</header>

<!-- Payment Section -->
<section class="payment">
    <h2>Payment</h2>
    <p>Total Amount: $<span th:text="${totalAmount}"></span></p>
    <p>Please proceed with the payment:</p>
    <form th:action="@{/fake-payment}" method="post" class="payment-form">
        <button type="submit" class="btn">Pay Now</button>
    </form>
</section>

</body>
</html>
